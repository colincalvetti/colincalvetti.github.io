<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
    {% include head.html %}
</head>
<body class="{{ page.body_class }}">
    <a href="#main" class="skip-link">Skip to main content</a>

    {% include header.html %}

    <main id="main" class="main">
        {{ content }}
    </main>

    {% include footer.html %}

    {%- for script in page.scripts -%}
    <script src="{{ '/assets/js/' | append: script | append: '.js' | relative_url }}" defer></script>
    {%- endfor -%}
</body>
</html>
